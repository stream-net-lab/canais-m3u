<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Canais Play — TV, Filmes e Séries</title>
  
  <!-- Configurações PWA para iPhone e Android -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Canais Play">
  <meta name="theme-color" content="#0b0c10">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="./logos/playtv.png">
  
  <!-- Fontes e HLS.js -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra Superior / Header -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo">
        <span class="logo-red">CANAIS</span><span class="logo-white">PLAY</span>
      </div>
      <nav class="nav-tabs">
        <button class="nav-tab active" data-tab="canais">📺 Canais</button>
        <button class="nav-tab" data-tab="filmes">🎬 Filmes & Séries</button>
        <button class="nav-tab" data-tab="favoritos">⭐ Favoritos</button>
      </nav>
    </div>
    
    <div class="header-right">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Buscar canais ou filmes..." autocomplete="off">
        <button id="clearSearch" class="btn-clear hidden">✕</button>
      </div>
    </div>
  </header>

  <!-- Categorias em Pílulas (Filtros) -->
  <div class="categories-bar" id="categoriesBar">
    <!-- Pílulas geradas via JS -->
  </div>

  <!-- Container Principal -->
  <main class="main-content">
    
    <!-- Aba de Canais -->
    <section id="tabCanais" class="tab-pane active">
      <div class="section-header">
        <h2 id="canaisTitle">Canais de TV ao Vivo</h2>
        <span class="count-badge" id="canaisCount">249 canais</span>
      </div>
      <div class="channels-grid" id="channelsGrid">
        <div class="loading-spinner">Carregando canais...</div>
      </div>
    </section>

    <!-- Aba de Filmes e Séries -->
    <section id="tabFilmes" class="tab-pane">
      <div id="destaquesContainer">
        <!-- Fileiras horizontais de filmes geradas via JS -->
      </div>
    </section>

    <!-- Aba de Favoritos -->
    <section id="tabFavoritos" class="tab-pane">
      <div class="section-header">
        <h2>Seus Favoritos</h2>
        <span class="count-badge" id="favsCount">0 itens</span>
      </div>
      <div class="channels-grid" id="favoritesGrid">
        <p class="empty-state">Você ainda não adicionou nenhum canal ou filme aos favoritos. Clique na estrela (⭐) para favoritar!</p>
      </div>
    </section>

  </main>

  <!-- Player Modal em Tela Cheia -->
  <div class="player-modal hidden" id="playerModal">
    <div class="player-topbar">
      <div class="player-info">
        <button class="btn-back" id="btnClosePlayer" title="Voltar">‹ Voltar</button>
        <div class="player-title-box">
          <h3 id="playerTitle">Nome do Canal</h3>
          <span class="source-status-badge" id="playerSourceBadge">Fonte 1 (Principal)</span>
        </div>
      </div>

      <div class="player-actions">
        <!-- Seletor manual de fontes -->
        <div class="dropdown" id="sourceSelectorDropdown">
          <button class="btn-dropdown" id="btnSources">Fontes ▾</button>
          <div class="dropdown-menu hidden" id="sourcesMenu"></div>
        </div>
        <button class="btn-icon" id="btnFavModal" title="Favoritar">★</button>
        <button class="btn-icon" id="btnPip" title="Picture in Picture">🗗</button>
        <button class="btn-icon" id="btnFullscreen" title="Tela Cheia">⛶</button>
      </div>
    </div>

    <div class="video-wrapper">
      <video id="videoElement" playsinline controls></video>
      <div class="player-loader hidden" id="playerLoader">
        <div class="spinner"></div>
        <p id="loaderMessage">Conectando ao sinal...</p>
      </div>
      <!-- Toast flutuante de notificação de failover -->
      <div class="player-toast hidden" id="playerToast"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
