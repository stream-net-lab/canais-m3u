name: Atualizar Canais Ao Vivo (a cada 30 min)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: atualizar-lista
  cancel-in-progress: false

jobs:
  aovivo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Atualizar canais ao vivo
        run: python scripts/atualizar_lista.py --aovivo

      - name: Publicar (commit unico, sem acumular historico)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nenhuma alteracao."
            exit 0
          fi
          git checkout --orphan publicar
          git add -A
          git commit -m "Auto: atualizacao dos canais ao vivo"
          git push --force origin publicar:main
