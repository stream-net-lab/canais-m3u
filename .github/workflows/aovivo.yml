name: Atualizar Canais Ao Vivo (a cada 30 min)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      novas_listas:
        description: 'URL(s) de novas listas M3U ou Xtream enviadas pelo painel do celular (uma por linha)'
        required: false
        default: ''

concurrency:
  group: atualizar-lista
  cancel-in-progress: false

jobs:
  aovivo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Atualizar canais ao vivo
        env:
          NOVAS_LISTAS_PAINEL: ${{ github.event.inputs.novas_listas }}
        run: python scripts/atualizar_lista.py --aovivo

      - name: Publicar atualizacoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nenhuma alteracao."
            exit 0
          fi
          git commit -m "Auto: atualizacao dos canais ao vivo"
          git pull --rebase -X ours origin main || true
          git push origin main
